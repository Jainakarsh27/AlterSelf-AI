<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlterSelf AI | Temporal History</title>
    <style>
        :root { --primary: #9333ea; --bg: #0b0118; --card: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); }
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .gradient-bg { position: fixed; inset: 0; background: radial-gradient(circle at 0% 0%, #1e0b36 0%, #0b0118 100%); z-index: -1; }
        .container { width: 100%; max-width: 450px; padding: 60px 24px; box-sizing: border-box; }
        h1 { font-size: 40px; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; letter-spacing: -2px; }
        .subtitle { color: #666; font-weight: 950; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; }
        .history-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 120px; }
        .history-item { aspect-ratio: 2/3; background: var(--card); border: 1px solid var(--border); border-radius: 24px; overflow: hidden; position: relative; }
        .item-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
        .bottom-nav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 280px; height: 60px; background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 30px; display: flex; align-items: center; justify-content: space-around; padding: 0 10px; z-index: 1000; }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="container">
        <h1>Temporal</h1>
        <div class="subtitle">Neural Forge History</div>
        <div class="history-grid">
            <div class="history-item"><img src="https://picsum.photos/id/64/400/600" style="width:100%; height:100%; object-fit:cover;"><div class="item-info"><div style="font-size:10px; font-weight:900;">#1042 - CYBER</div></div></div>
            <div class="history-item"><img src="https://picsum.photos/id/91/400/600" style="width:100%; height:100%; object-fit:cover;"><div class="item-info"><div style="font-size:10px; font-weight:900;">#1043 - VECTOR</div></div></div>
            <div class="history-item"><img src="https://picsum.photos/id/177/400/600" style="width:100%; height:100%; object-fit:cover;"><div class="item-info"><div style="font-size:10px; font-weight:900;">#1044 - ANIME</div></div></div>
            <div class="history-item"><img src="https://picsum.photos/id/1014/400/600" style="width:100%; height:100%; object-fit:cover;"><div class="item-info"><div style="font-size:10px; font-weight:900;">#1045 - CYBER</div></div></div>
        </div>
    </div>
    <div class="bottom-nav">
        <div style="opacity: 0.3; cursor:pointer;" onclick="window.location='dashboard.html'">📱</div>
        <div style="color: var(--primary); cursor:pointer;">⏳</div>
        <div style="width: 40px"></div>
        <div style="opacity: 0.3; cursor:pointer;" onclick="window.location='settings.html'">⚙️</div>
        <div style="opacity: 0.3; cursor:pointer;" onclick="window.location='profile.html'">👤</div>
    </div>
</body>
</html>
